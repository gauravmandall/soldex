[package]
name = "soldex-engine"
version = "0.1.0"
edition = "2021"
authors = ["Soldex Team"]
description = "Privacy-focused DEX engine for Solana perps + Polymarket"

[[bin]]
name = "soldex-engine"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1.38", features = ["full"] }
tokio-tungstenite = { version = "0.23", features = ["native-tls"] }

# Solana SDK
solana-client = "=1.18.26"
solana-sdk = "=1.18.26"
solana-transaction-status = "=1.18.26"
anchor-client = { version = "0.30.1", features = ["async"] }
anchor-lang = "0.30.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
borsh = "0.10"

# HTTP client (Polymarket API)
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"] }
reqwest-eventsource = "0.6"
tokio-util = { version = "0.7", features = ["io"] }
futures-util = "0.3"
base64 = "0.22"

# WebSocket server (frontend connection)
axum = { version = "0.7", features = ["ws"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }

# Crypto / privacy
sha2 = "0.10.8"
hmac = "0.12"
aes-gcm = "0.10"   # encrypt stored keypairs

# Orderbook
rust_decimal = { version = "1.33", features = ["serde-float"] }
ordered-float = "4.2"
dashmap = "5.5"    # concurrent hashmap for orders

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Config
config = "0.14"
dotenvy = "0.15"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Risk engine math
statrs = "0.17"

[dev-dependencies]
tokio-test = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
base64 = "0.22"
futures-util = "0.3"
uuid = { version = "1.10", features = ["v4"] }
hex = "0.4"
bs58 = "0.5"

[patch.crates-io]
curve25519-dalek = { git = "https://github.com/solana-labs/curve25519-dalek.git", rev = "b500cdc9c92a11572d13f05da379367ca23b5b17" }
