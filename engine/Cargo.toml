[package]
name = "soldex-engine"
version = "0.1.0"
edition = "2021"
authors = ["Soldex Team"]
description = "Privacy-focused DEX engine for Solana perps + Polymarket"

[[bin]]
name = "soldex-engine"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1.32", features = ["full"] }
tokio-tungstenite = { version = "0.21", features = ["native-tls"] }
solana-pubsub-client = "2.2.1"

# Solana SDK — bumped to match soldex-perps (anchor 0.32.1 requires solana 2.x)
solana-client = "=2.2.1"
solana-sdk = "=2.2.1"
solana-transaction-status = "=2.2.1"
anchor-client = { version = "0.32.1", features = ["async"] }
anchor-lang = "0.32.1"

#soldex-perps
soldex-perps = { path = "../programs/soldex-perps", features = ["no-entrypoint"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
borsh = "0.10"

# HTTP client (Polymarket API)
reqwest = { version = "0.11", features = ["json", "rustls-tls", "stream"] }
reqwest-eventsource = "0.5"
tokio-util = { version = "0.7", features = ["io"] }
futures-util = "0.3"
base64 = "0.21"

# WebSocket server (frontend connection)
axum = { version = "0.6", features = ["ws"] }
tower = "0.4"
tower-http = { version = "0.4", features = ["cors", "trace"] }

# Crypto / privacy
sha2 = "0.10.8"
hmac = "0.12"
aes-gcm = "0.10"

# Orderbook
rust_decimal = { version = "1.33", features = ["serde-float"] }
ordered-float = "4.2"
dashmap = "5.5"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Config
config = "0.14"
dotenvy = "0.15"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Risk engine math
statrs = "0.17"
rand = "0.8"
uuid = { version = "1.4", features = ["v4"] }
hex = "0.4"
bs58 = "0.5"
url = "2.5"


[dev-dependencies]
tokio-test = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen_units = 1


